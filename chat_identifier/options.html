<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Voice Gateway Options</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <img src="icons/icon48.png" alt="Voice Gateway Icon" class="app-icon">
            <h1 class="app-title">Gateway Configuration</h1>
            <div class="header-actions">
                <a href="#" id="popup-link" title="Back to Popup" class="icon-button settings-button">🏠</a>
                <a href="#" id="logs-link" title="View Logs" class="icon-button logs-button">📜</a>
            </div>
        </header>

        <div id="status-message" class="status-message" aria-live="polite"></div>

        <section class="control-section">
            <div class="control-grid-options">
                <fieldset class="control-item-fieldset">
                    <legend>Playback Options</legend>
                    <div class="checkbox-item">
                        <input type="checkbox" id="speak-on-completion-toggle" title="If enabled, the extension will automatically speak new bot messages as they appear.">
                        <label for="speak-on-completion-toggle">Speak new bot replies automatically (Live)</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="speak-on-load-toggle" title="If enabled, the extension will speak the last bot message when the page is loaded or reloaded.">
                        <label for="speak-on-load-toggle">Speak last message when a page is loaded/reloaded</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="play-in-browser-toggle" title="If enabled, audio will be played in the browser instead of on the server.">
                        <label for="play-in-browser-toggle">Play in browser</label>
                    </div>
                </fieldset>

                <fieldset class="control-item-fieldset">
                    <legend>Pre-Speech Text Processing</legend>
                    <div class="checkbox-item-with-button">
                        <div class="checkbox-item">
                            <input type="checkbox" id="use-formatting-toggle">
                            <label for="use-formatting-toggle">Enable text processing rules</label>
                        </div>
                        <button id="edit-json-button" class="action-button small-button">Edit Rules as JSON</button>
                    </div>
                    <fieldset id="processing-rules-group" class="nested-fieldset">
                        <div id="rules-container">
                            <!-- Checkboxes will be generated by JS -->
                        </div>
                    </fieldset>
                </fieldset>

                <fieldset class="control-item-fieldset">
                    <legend>Piper TTS Configuration</legend>
                    <div class="model-select-group">
                        <label for="piper-model-select">Voice Model:</label>
                        <select id="piper-model-select"></select>
                    </div>
                    <div class="speaker-preview-row">
                        <div class="model-select-group" id="piper-speaker-group" hidden>
                            <label for="piper-speaker-select">Speaker:</label>
                            <select id="piper-speaker-select"></select>
                        </div>
                        <div class="preview-container">
                            <button id="preview-voice-button" class="action-button small-button">Preview Voice</button>
                        </div>
                    </div>

                    <label class="control-label-small">Voice Characteristics:</label>
                    <div class="settings-grid">
                        <div class="control-group">
                            <label for="length-scale-input">Length Scale</label>
                            <input type="range" id="length-scale-range" min="0.1" max="2.0" step="0.05" value="1.0">
                            <input type="number" id="length-scale-input" step="0.05" min="0.1" max="2.0" title="Adjusts the speaking rate. Lower values make speech faster, higher values make it slower (0.1 - 2.0).">
                        </div>
                        <div class="control-group">
                            <label for="noise-scale-input">Noise Scale</label>
                            <input type="range" id="noise-scale-range" min="0" max="1.0" step="0.05" value="0.667">
                            <input type="number" id="noise-scale-input" step="0.05" min="0" max="1.0" title="Controls the randomness of the pitch. Higher values result in more varied, less monotonous speech (0.0 - 1.0).">
                        </div>
                        <div class="control-group">
                            <label for="noise-w-input">Noise W</label>
                            <input type="range" id="noise-w-range" min="0" max="1.0" step="0.05" value="0.8">
                            <input type="number" id="noise-w-input" step="0.05" min="0" max="1.0" title="Influences the overall expressiveness and 'wobbliness' of the voice (0.0 - 1.0).">
                        </div>
                         <div class="control-group">
                            <label for="sentence-silence-input">Sentence Silence</label>
                            <input type="range" id="sentence-silence-range" min="0.1" max="2.0" step="0.05" value="0.2">
                            <input type="number" id="sentence-silence-input" step="0.05" min="0.1" max="2.0" title="Sets the duration of pauses between sentences (0.1 - 2.0 seconds).">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="control-item-fieldset">
                    <legend>ASR Model Selection</legend>
                    <div class="model-select-group">
                        <label for="vosk-model-select">Default VOSK (ASR) Model:</label>
                        <select id="vosk-model-select"></select>
                    </div>
                </fieldset>
            </div>
        </section>

        <div class="save-all-settings-container">
            <button id="save-button" class="action-button">Save All Settings</button>
            <span id="status"></span>
        </div>
    </div>
    
    <div id="json-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Edit Formatting Rules</h2>
            <p>Modify the JSON structure directly. Invalid JSON will not be saved.</p>
            <div class="json-editor-area">
                <textarea id="json-editor"></textarea>
                <div class="preview-frame">
                    <h3>Formatting Preview</h3>
                    <div class="preview-section">
                        <span class="preview-label">Original Text:</span>
                        <div id="preview-original" class="preview-original"></div>
                    </div>
                    <div class="preview-section">
                        <span class="preview-label">Formatted Text:</span>
                        <div id="preview-formatted" class="preview-formatted"></div>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button id="cancel-json-button" class="action-button secondary-button">Cancel</button>
                <button id="apply-preview-button" class="action-button">Apply to Preview</button>
                <button id="save-json-button" class="action-button">Save JSON</button>
            </div>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>
